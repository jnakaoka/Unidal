version: '3.8'

services:
  api:
    build: ./backend
    container_name: unidal_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # - DATABASE_URL=mysql+mysqlconnector://unidal:admin_135@localhost/unidal
      - DATABASE_URL=mysql+mysqlconnector://unidal:admin_135@unidal_db/unidal
    volumes:
      - ./backend:/app

  db:
    image: mysql:8
    container_name: unidal_db
    restart: always
    environment:
      MYSQL_DATABASE: unidal
      MYSQL_ROOT_PASSWORD: admin_135
      MYSQL_USER: unidal
      MYSQL_PASSWORD: admin_135
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build: ./frontend
    container_name: unidal_frontend
    environment:
    - VITE_API_URL=http://localhost:8000
    ports:
      - "3010:80"
    depends_on:
      - api
    restart: always


volumes:
  db_data:
