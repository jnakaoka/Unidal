services:
  # Serviço para atualizar IP no DuckDNS
  # duckdns:
  #   image: linuxserver/duckdns
  #   container_name: duckdns
  #   environment:
  #     - SUBDOMAINS=apontamento-unidal
  #     - TOKEN=aba80c93-6027-4802-9d4b-5c89b57dd0af
  #     - LOG_FILE=false
  #   restart: always
  #   networks:
  #     - proxy

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    profiles:
      - production
    container_name: cloudflared
    restart: unless-stopped
    entrypoint: ["cloudflared"]
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--protocol",
        "http2",
        "--config",
        "/etc/cloudflared/config.yml",
        "run"
      ]
    volumes:
      - ./etc/cloudflared:/etc/cloudflared:ro
    networks:
      - proxy

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   networks:
  #     - proxy
  #   dns:
  #     - 1.1.1.1
  #     - 8.8.8.8
  #   volumes:
  #     - ./cloudflared:/etc/cloudflared:ro
  #   entrypoint: ["cloudflared"]
  #   command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]

  # Cloudflare Tunnel (serviço separado!)
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   command: tunnel --no-autoupdate run --token eyJhIjoiY2Y1ZGM0YmNjYzBjZGJlZWMwODgyODk4MzFlZDBiZDgiLCJ0IjoiZTQzNTNjZjktNDA4ZC00NzU1LWIyZWUtNDk5NGY4YWUwMWU2IiwicyI6IlkyRmlOemt3TXpFdE5EWXhOQzAwTURZekxXRXlZemt0TWpGaU9UQXpaV015T0dFeCJ9
  #   restart: always
  #   networks:
  #     - proxy
  #   logging:
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # Gerenciador de proxy reverso + HTTPS
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: always
    ports:
      - "80:80"     # HTTP (opcional com tunnel; pode deixar)
      - "81:81"     # Painel do NPM (local)
      - "443:443"   # HTTPS (opcional com tunnel)
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  api:
    build: ./backend
    container_name: unidal_api
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: unidal
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: unidal
      DB_HOST: db
      DB_PORT: 3306
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      - ./backend:/app
      - ./alembic.ini:/app/alembic.ini
      - ./backend/app/data:/app/data:rw
    networks:
      - proxy
      - internal

  db:
    image: mysql:8
    container_name: unidal_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: unidal
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: unidal
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - internal
    
  # api:
  #   build: ./backend
  #   container_name: unidal_api
  #   expose:
  #     - "8000"
  #   depends_on:
  #     - db
  #   environment:
  #     - DATABASE_URL=mysql+mysqlconnector://unidal:admin_135@db/unidal
  #   volumes:
  #     - ./backend:/app
  #     - ./alembic.ini:/app/alembic.ini
  #     - ./backend/app/data:/app/data:rw
  #   networks:
  #     - proxy
  #     - internal

  # db:
  #   image: mysql:8
  #   container_name: unidal_db
  #   restart: always
  #   environment:
  #     MYSQL_DATABASE: unidal
  #     MYSQL_ROOT_PASSWORD: admin_135
  #     MYSQL_USER: unidal
  #     MYSQL_PASSWORD: admin_135
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   networks:
  #     - internal

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_PUBLIC_API_URL: https://api.apontamento-unidal.duckdns.org
        VITE_API_URL: https://api.unidal.pt
    container_name: unidal_frontend
    expose:
      - "80"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: always
    networks:
      - proxy

volumes:
  db_data:
  npm_data:
  npm_letsencrypt:

networks:
  proxy:
    external: true
    name: unidal_proxy
  internal:
    driver: bridge

