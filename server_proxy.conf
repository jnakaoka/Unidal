# Custom server proxy overrides - adds CORS safe echo of Origin.
# This file is included inside the server { ... } block of the proxy host.
# Handle preflight OPTIONS and add headers on responses (always).

# Custom server proxy overrides - adiciona CORS (echo do Origin).
# Incluído dentro do bloco server { ... } do proxy host.

# Se for preflight, devolve 204 (sem corpo)
if ($request_method = 'OPTIONS') {
  return 204;
}

# Headers CORS aplicados sempre (inclui 204)
add_header 'Access-Control-Allow-Origin' "$http_origin" always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'Accept, Accept-Language, Authorization, Content-Language, Content-Type, Origin' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Max-Age' 86400 always;
add_header 'Vary' 'Origin' always;
